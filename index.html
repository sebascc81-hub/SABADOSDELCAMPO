<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABADOS DEL CAMPO</title>
    <style>
        /* --- ESTILOS TEMÁTICOS DE LA BOLSA DE MALLA ROJA --- */
        
        :root {
            --rojo-malla: #d32f2f; /* Rojo base */
            --rojo-malla-claro: #f44336; /* Líneas de la red */
            --rojo-oscuro: #b71c1c; /* Sombras y bordes */
            --color-fondo-sitio: #f1e4d3; /* Color beige rústico tipo papel kraft */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--color-fondo-sitio);
            display: flex;
            justify-content: center;
        }

        /* Contenedor Principal: LA BOLSA */
        .bolsa-mercado {
            background-color: var(--rojo-malla);
            /* --- EL TRUCO DE LA MALLA (CSS Puro) --- */
            background-image: 
                linear-gradient(90deg, var(--rojo-malla-claro) 1px, transparent 1px),
                linear-gradient(var(--rojo-malla-claro) 1px, transparent 1px);
            background-size: 15px 15px; /* Tamaño del rombo de la red */
            
            width: 100%;
            max-width: 900px;
            border-radius: 25px; /* Bordes redondeados para la forma de bolsa */
            box-shadow: 10px 15px 30px rgba(0,0,0,0.3); /* Sombra para dar volumen */
            border: 10px solid var(--rojo-oscuro);
            overflow: hidden; /* Mantiene el contenido dentro de la forma */
            display: flex;
            flex-direction: column;
        }

        /* Parte superior de la bolsa (donde se cierra) */
        .boca-bolsa {
            background-color: var(--rojo-oscuro);
            padding: 20px;
            text-align: center;
            color: white;
            border-bottom: 5px solid rgba(0,0,0,0.2);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .boca-bolsa h1 { margin: 0; font-size: 24px; }
        .boca-bolsa p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        /* Contenedor del interior rústico */
        .interior-bolsa {
            background-color: rgba(255, 255, 255, 0.92);
            margin: 20px; 
            padding: 25px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: 2fr 1fr; /* Catálogo grande, Carrito pequeño */
            gap: 25px;
        }

        /* --- ESTILOS DE PRODUCTOS Y CARRITO --- */

        h2, h3 { color: var(--rojo-oscuro); margin-top: 0; }

        /* Menú Desplegable */
        .select-combo {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--rojo-oscuro);
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: white;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .select-combo:focus {
            outline: none;
            border-color: #ffca28;
            box-shadow: 0 0 5px rgba(255, 202, 40, 0.5);
        }

        /* Catálogo */
        .catalogo { display: flex; flex-direction: column; gap: 15px; }
        
        .combo-card {
            background: white;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .combo-card:hover { transform: translateY(-3px); }
        .combo-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 8px; border-bottom: 2px solid #ffca28; padding-bottom: 5px;}
        .combo-desc { font-size: 14px; color: #555; margin: 5px 0 15px; line-height: 1.5; }
        .combo-price { font-size: 18px; font-weight: bold; color: #2e7d32; text-align: center; }

        .btn-agregar {
            background-color: var(--rojo-malla);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-agregar:hover { background-color: var(--rojo-oscuro); }

        /* Panel Carrito */
        .panel-carrito {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            height: fit-content;
            position: sticky; top: 20px;
        }

        .item-carrito { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #eee; }
        .total-carrito { font-size: 20px; font-weight: bold; color: #2e7d32; text-align: right; margin-top: 15px; border-top: 2px solid #ddd; padding-top: 10px; }
        
        input, .btn-confirmar { padding: 12px; margin-top: 8px; width: 100%; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        .btn-confirmar { background-color: #2e7d32; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .btn-confirmar:hover { background-color: #1b5e20; }
        .btn-vaciar { background-color: #757575; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer; font-size: 11px; width: 100%; margin-top: 10px; }

        /* Adaptación Móvil */
        @media (max-width: 768px) {
            .interior-bolsa { grid-template-columns: 1fr; }
            .bolsa-mercado { border-radius: 0; border: none; }
            body { padding: 0; }
        }
    </style>
</head>
<body>

    <div class="bolsa-mercado">
        
        <div class="boca-bolsa">
            <h1>SABADOS DEL CAMPO</h1>
            <p>"La frescura de la plaza, en la puerta de tu casa"</p>
        </div>

        <div class="interior-bolsa">
            
            <div class="catalogo">
                <h2>Elige tu Combo</h2>
                
                <select class="select-combo" id="selector-combo" onchange="mostrarComboSeleccionado()">
                    <option value="0">Combo Familiar (4-5 PERSONAS)</option>
                    <option value="1">Combo Sancochero (4-5 PERSONAS)</option>
                    <option value="2">Combo Paisa (4-5 PERSONAS)</option>
                    <option value="3">Combo Apartamentero (1-2 PERSONAS)</option>
                </select>

                <div class="combo-card">
                    <div class="combo-title" id="combo-titulo">Combo Familiar (4-5 PERSONAS)</div>
                    <div class="combo-desc" id="combo-desc">
                        </div>
                    <div class="combo-price" id="combo-precio">$75.000</div>
                    <button class="btn-agregar" id="btn-agregar-combo" onclick="agregarAlCarrito('Combo Familiar', 65000)">Agregar a la Bolsa</button>
                </div>

            </div>

            <div class="panel-carrito">
                <h3 style="margin-top: 0;">🛒 Tu Pedido</h3>
                <div id="lista-carrito">
                    <p style="color: #999; font-size: 14px; text-align: center;">Tu bolsa está vacía</p>
                </div>
                <div class="total-carrito">Total: $<span id="gran-total">0</span></div>
                <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar Bolsa</button>

                <h3 style="margin-top: 25px;">Datos de Entrega</h3>
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <input type="text" id="telefono" placeholder="Teléfono / WhatsApp" required>
                <input type="text" id="direccion" placeholder="Dirección exacta" required>

                <button class="btn-confirmar" onclick="enviarPedido()">Confirmar y Enviar</button>
            </div>

        </div> 
    </div> 
    
    <script>
        // --- BASE DE DATOS DE COMBOS ---
        const combosBD = [
            {
                nombreCarrito: 'Combo Familiar',
                titulo: 'Combo Familiar (4-5 PERSONAS)',
                desc: '• Papa Nevada (3 Kilo)<br>• Tomate Árbol (3 Kilo)<br>• Tomate Chonto (1.5 Kilo)<br>• Cebolla Huevo (1 Kilo)<br>• Cebolla Larga (1 Kilo)<br>• Plátano Maduro (1 Kilo)<br>• Plátano Verde (1 Kilo)<br>• Zanahoria (1 Kilo)<br>• Banano (1 Kilo)<br>• Limón Tahití (1 Kilo)<br>• Lechuga Crespa (1 Und)<br>• Papa Criolla (1 Kilo)<br><br><em>* Incluye Domicilio/Empaque (1 Und)</em>',
                precioTexto: '$75.000',
                precioValor: 65000
            },
            {
                nombreCarrito: 'Combo Sancochero',
                titulo: 'Combo Sancochero (4-5 PERSONAS)',
                desc: '• Papa Nevada (2 Kilo)<br>• Tomate Chonto (1.5 Kilo)<br>• Cilantro (1 Manojo)<br>• Yuca (1 Libra)<br>• Mazorca (1 Bandeja)<br>• Aguacate (1 Kilo)<br>• Plátano Maduro (1 Kilo)<br>• Plátano Verde (1 Kilo)<br>• Cebolla Larga (1 Kilo)<br>• Limón Tahití (1 Kilo)<br>• Papa Criolla (1 Kilo)<br>• Banano (1 Kilo)<br><br><em>* Incluye Domicilio/Empaque (1 Und)</em>',
                precioTexto: '$75.000',
                precioValor: 55000
            },
            {
                nombreCarrito: 'Combo Paisa',
                titulo: 'Combo Paisa (4-5 PERSONAS)',
                desc: '• Frijol Verde (2 Libras)<br>• Plátano Verde (1 Kilo)<br>• Plátano Maduro (1 Kilo)<br>• Tomate Chonto (1 Kilo)<br>• Cebolla Huevo (1 Kilo)<br>• Zanahoria (1 Kilo)<br>• Cebolla Larga (1 Kilo)<br>• Aguacate (2 Kilo)<br><br><em>* Incluye Domicilio/Empaque (1 Und)</em>',
                precioTexto: '$65.000',
                precioValor: 45000
            },
            {
                nombreCarrito: 'Combo Apartamentero',
                titulo: 'Combo Apartamentero (1-2 PERSONAS)',
                desc: '• Papa Nevada (1 Kilo)<br>• Mango (1 Kilo)<br>• Tomate Chonto (1 Kilo)<br>• Cebolla Huevo (0.5 Kilo)<br>• Plátano Verde(1 Libra)<br>• Plátano Maduro (1 Libra)<br>• Zanahoria (1 Kilo)<br>• Banano (1 Kilo)<br>• Limón Tahití (1 Kilo)<br>• Lechuga Crespa (1 Und)<br>• Papa Criolla (1 Kilo)<br><br><em>* Incluye Domicilio/Empaque (1 Und)</em>',
                precioTexto: '$45.000',
                precioValor: 35000
            }
        ];

        // --- FUNCIÓN PARA ACTUALIZAR LA TARJETA DEL COMBO ---
        function mostrarComboSeleccionado() {
            let indiceSeleccionado = document.getElementById("selector-combo").value;
            let combo = combosBD[indiceSeleccionado];

            document.getElementById("combo-titulo").innerText = combo.titulo;
            document.getElementById("combo-desc").innerHTML = combo.desc;
            document.getElementById("combo-precio").innerText = combo.precioTexto;
            
            // Actualizamos la acción del botón de agregar
            let btnAgregar = document.getElementById("btn-agregar-combo");
            btnAgregar.setAttribute("onclick", `agregarAlCarrito('${combo.nombreCarrito}', ${combo.precioValor})`);
        }

        // Inicializar la vista con el primer combo al cargar la página
        window.onload = function() {
            mostrarComboSeleccionado();
        };

        // --- LÓGICA DEL CARRITO (Original) ---
        let carrito = [];

        function agregarAlCarrito(nombre, precio) {
            let productoExistente = carrito.find(item => item.nombre === nombre);
            if (productoExistente) {
                productoExistente.cantidad++;
            } else {
                carrito.push({ nombre: nombre, precio: precio, cantidad: 1 });
            }
            actualizarUI();
        }

        function vaciarCarrito() {
            carrito = [];
            actualizarUI();
        }

        function actualizarUI() {
            let listaHTML = document.getElementById('lista-carrito');
            let totalVisual = document.getElementById('gran-total');
            let html = '';
            let total = 0;

            if (carrito.length === 0) {
                listaHTML.innerHTML = '<p style="color: #999; font-size: 14px; text-align: center;">Tu bolsa está vacía</p>';
                totalVisual.innerText = '0';
                return;
            }

            carrito.forEach((item) => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                html += `
                    <div class="item-carrito">
                        <span>${item.cantidad}x ${item.nombre}</span>
                        <span>$${subtotal.toLocaleString('es-CO')}</span>
                    </div>
                `;
            });

            listaHTML.innerHTML = html;
            totalVisual.innerText = total.toLocaleString('es-CO');
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert("Tu bolsa está vacía.");
                return;
            }

            let nombre = document.getElementById('nombre').value;
            let telefono = document.getElementById('telefono').value;
            let direccion = document.getElementById('direccion').value;

            if(!nombre || !telefono || !direccion) {
                alert("Por favor, completa tus datos.");
                return;
            }

            let resumenPedido = carrito.map(item => `${item.cantidad}x ${item.nombre}`).join(' | ');
            let totalAPagar = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            let datos = {
                nombre: nombre,
                telefono: telefono,
                direccion: direccion,
                pedido: resumenPedido,
                total: totalAPagar
            };

            // !!! REEMPLAZA ESTA URL CON LA DE GOOGLE APPS SCRIPT !!!
            let urlAppsScript = "URL_DE_TU_APLICACION_WEB_AQUI";

            fetch(urlAppsScript, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            }).then(() => {
                alert("¡Pedido recibido! Prepararemos tu bolsa de malla roja y te contactaremos pronto.");
                vaciarCarrito();
                document.getElementById('nombre').value = '';
                document.getElementById('telefono').value = '';
                document.getElementById('direccion').value = '';
            }).catch(error => {
                console.error('Error:', error);
                alert("Hubo un problema al enviar el pedido.");
            });
        }
    </script>
</body>
</html>
